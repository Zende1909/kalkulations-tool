name: CI

on:
  push:
    branches:
      - main
      - phase-e-ci
      - phase-e-db-safety
  pull_request:
    branches:
      - main

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d ci_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Explicit test environment (so security guards don't block with default secrets).
      APP_ENV: test
      # Tests / production-like path: no create_all / ensure_* in lifespan.
      ALLOW_STARTUP_SCHEMA_BOOTSTRAP: "false"
      JWT_SECRET_KEY: ci-test-jwt-secret
      JWT_ALGORITHM: HS256

      DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@127.0.0.1:5432/ci_db
      CORS_ORIGINS: http://localhost:5173
      LOCAL_ADMIN_SEED_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Alembic migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
