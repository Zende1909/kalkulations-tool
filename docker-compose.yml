services:
  db:
    image: postgres:16-alpine
    container_name: kalkulation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalkulation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalkulation_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kalkulation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalkulation} -d ${POSTGRES_DB:-kalkulation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kalkulation-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kalkulation}:${POSTGRES_PASSWORD:-kalkulation_secret}@db:5432/${POSTGRES_DB:-kalkulation}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      CORS_ORIGINS: http://localhost:5173,http://frontend:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kalkulation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
